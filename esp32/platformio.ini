; FlightScanr: zwei Varianten im selben Projekt
;
;  oled      : ESP32-WROOM-32E mit 0,96"-OLED, Taster und Radius-Schalter (bisherige Variante)
;  tft7_uart : ESP32-S3 mit 7"-Display (800x480) und Touch, Board mit USB-Seriell-Chip (CH340/CP210x)
;  tft7_usb  : wie tft7_uart, aber für Boards, bei denen der native USB-Anschluss benutzt wird
;
; Hochladen z. B. mit:  pio run -e tft7_uart -t upload
; Ohne Angabe von -e wird "oled" gebaut.
;
; Gemeinsamer Code (Netzwerk, Parsing, Geografie, Airline-Tabelle) liegt in src/.
; Nur für die 7"-Variante liegt Code in src/tft7/, nur für das OLED in den Dateien
; main.cpp, display.*, button.* und radius_switch.* direkt in src/.

[platformio]
default_envs = oled

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7

[env:oled]
board = esp32dev
lib_deps =
    ${env.lib_deps}
    olikraus/U8g2@^2.35
build_src_filter = +<*> -<tft7/>

[env:tft7_uart]
board = esp32-s3-devkitc-1
build_flags = -DARDUINO_USB_CDC_ON_BOOT=0
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit GFX Library@^1.11.9
build_src_filter = +<*> -<main.cpp> -<display.cpp> -<button.cpp> -<radius_switch.cpp>

[env:tft7_usb]
board = esp32-s3-devkitc-1
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit GFX Library@^1.11.9
build_src_filter = +<*> -<main.cpp> -<display.cpp> -<button.cpp> -<radius_switch.cpp>
